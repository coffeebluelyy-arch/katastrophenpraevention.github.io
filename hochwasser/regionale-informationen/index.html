<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regionale Informationen</title>
    <link rel="stylesheet" href="../../css/style.css">
    <script src="../../js/script.js" defer></script>
</head>
<body>
    <header class="hero-header">
        <img src="../../images/hochwasser_title_big.png" alt="HOCHWASSER" class="hero-title-image">
    </header>

    <div class="sticky-bar">
        <div class="sticky-text-image-wrap">
            <img src="../../images/information_title_small.png" alt="Infos für deine Region" class="sticky-text-image">
        </div>

        <div class="sticky-icons">
            <a class="icon-link" href="../../index.html" aria-label="Startseite">
                <img src="../../images/Rectangle 110.png" alt="" class="icon-img">
            </a>

            <div class="header-tool search-tool">
                <button class="icon-link icon-button" id="searchToggle" aria-label="Suche öffnen" type="button">
                    <img src="../../images/Group 95.png" alt="" class="icon-img">
                </button>

                <div class="search-panel" id="searchPanel">
                    <div class="search-dummy">Suche...</div>
                </div>
            </div>

            <div class="header-tool menu-tool">
                <button class="icon-link icon-button" id="menuToggle" aria-label="Menü öffnen" type="button">
                    <img src="../../images/Group 94.png" alt="" class="icon-img">
                </button>

                <div class="menu-panel" id="menuPanel">
                    <img src="../../images/menu.png" alt="Menü" class="menu-panel-image">

                    <button class="menu-hitbox menu-close-hitbox" type="button" data-menu-close aria-label="Menü schließen"></button>

                    <a href="../../wissenswertes/index.html" class="menu-hitbox menu-link-hitbox menu-hitbox-wissenswertes" aria-label="Zu Wissenswertes"></a>

                    <a href="../../krisen-flyer/index.html" class="menu-hitbox menu-link-hitbox menu-hitbox-krisenflyer" aria-label="Zu Krisen-Flyer"></a>

                    <a href="../../hochwasser/index.html" class="menu-hitbox menu-link-hitbox menu-hitbox-hochwasser" aria-label="Zu Hochwasser"></a>

                    <a href="#about" class="menu-hitbox menu-link-hitbox menu-hitbox-about" aria-label="Zu About"></a>
                </div>
            </div>
        </div>
    </div>

<main class="subpage-layout">
    <section class="subpage-content">
        <div class="regionale-informationen-shell">
            <img src="../../images/information_loading.png"
                 alt="Regionale Informationen"
                 class="regionale-informationen-image"
                 id="regionaleInfoImage">

            <div class="regionale-popup-overlay is-visible" id="regionalePopupOverlay">
                <button class="regionale-popup-trigger"
                        id="regionalePopupTrigger"
                        type="button"
                        aria-label="Informationen automatisch ausfüllen">
                    <img src="../../images/information_insert.png"
                         alt="Informationen einfügen"
                         class="regionale-popup-image">
                </button>

                <div class="regionale-popup-toast" id="regionalePopupToast" aria-live="polite">
                    bip bap bup automatisches ausfüllen
                </div>
            </div>
        </div>
    </section>

    <aside class="sticky-side subpage-side">
        <a href="../../krisen-flyer/index.html" class="side-image-link" aria-label="Zum Krisen-Flyer">
            <img src="../../images/Druckmaterial.png" alt="Druckmaterial" class="img-box img-tall">
        </a>
    </aside>
</main>

    <footer class="site-footer" id="about">
        <div class="footer-column footer-names">
            <p>Created by ₍ᐢ. .ᐢ₎</p>
            <p>Oti, Ao, Selina, Lyra</p>
        </div>

        <div class="footer-column footer-rights">
            <p>All rights reserved</p>
        </div>

        <div class="footer-column footer-logos">
            <img src="../images/logo_1.png" alt="Logo 1" class="footer-logo">
            <img src="../images/logo_2.png" alt="Logo 2" class="footer-logo">
            <img src="../images/logo_3.png" alt="Logo 3" class="footer-logo">
        </div>
    </footer>
</body>
</html>
