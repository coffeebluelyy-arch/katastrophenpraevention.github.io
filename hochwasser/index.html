<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hochwasser</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/script.js" defer></script>
</head>
<body>
    <header class="hero-header">
        <h1 class="hero-title">HOCHWASSER</h1>
    </header>

    <div class="sticky-bar">
        <div class="sticky-text">Was soll ich tun?</div>

        <div class="sticky-icons">
            <a class="icon-link" href="../index.html" aria-label="Startseite">
                <img src="../images/Rectangle 110.png" alt="" class="icon-img">
            </a>

            <div class="header-tool search-tool">
                <button class="icon-link icon-button" id="searchToggle" aria-label="Suche öffnen" type="button">
                    <img src="../images/Group 95.png" alt="" class="icon-img">
                </button>

                <div class="search-panel" id="searchPanel">
                    <div class="search-dummy">Suche...</div>
                </div>
            </div>

            <div class="header-tool menu-tool">
                <button class="icon-link icon-button" id="menuToggle" aria-label="Menü öffnen" type="button">
                    <img src="../images/Group 94.png" alt="" class="icon-img">
                </button>

                <div class="menu-panel" id="menuPanel">
                    <a href="../krisen-flyer/index.html">Krisen-Flyer</a>
                    <a href="../hochwasser/index.html">Hochwasser</a>
                    <a href="../wissenswertes/index.html">Wissenswertes</a>
                    <a href="#about">About</a>
                </div>
            </div>
        </div>
    </div>

    <main class="subpage-layout">
        <section class="subpage-content">
            <div class="hochwasser-shell">
                <div class="hochwasser-stack">
                    <img src="../images/hochwasser1.png" alt="Hochwasser 1" class="hochwasser-image">

                    <section class="hochwasser-toggle-panel" aria-label="Hochwasser Phasen">
                        <div class="hochwasser-toggle-bg" aria-hidden="true"></div>

                        <div class="hochwasser-toggle-content">
                            <div class="toggle-module" data-toggle-group="davor" data-state="open">
                                <img src="../images/davor_open.png" alt="Davor geöffnet" class="toggle-image is-active" data-variant="open">
                                <img src="../images/davor_closed.png" alt="Davor eingeklappt" class="toggle-image" data-variant="closed">
                                <button class="toggle-hitbox" type="button" aria-label="Davor umschalten"></button>
                            </div>

                            <div class="toggle-module" data-toggle-group="waerend" data-state="closed">
                                <img src="../images/waerend_open.png" alt="Während geöffnet" class="toggle-image" data-variant="open">
                                <img src="../images/waerend_closed.png" alt="Während eingeklappt" class="toggle-image is-active" data-variant="closed">
                                <button class="toggle-hitbox" type="button" aria-label="Während umschalten"></button>
                            </div>

                            <div class="toggle-module" data-toggle-group="danach" data-state="closed">
                                <img src="../images/danach_open.png" alt="Danach geöffnet" class="toggle-image" data-variant="open">
                                <img src="../images/danach_closed.png" alt="Danach eingeklappt" class="toggle-image is-active" data-variant="closed">
                                <button class="toggle-hitbox" type="button" aria-label="Danach umschalten"></button>
                            </div>
                        </div>
                    </section>
                    <a href="../wissenswertes/index.html">

                    <img src="../images/hochwasserblue.png" alt="Hochwasser Blue" class="hochwasser-image">
                    </a>
                </div>
            </div>
        </section>

        <aside class="sticky-side subpage-side">
            <a href="../krisen-flyer/index.html" class="side-image-link" aria-label="Zum Krisen-Flyer">
                <img src="../images/Druckmaterial.png" alt="Druckmaterial" class="img-box img-tall">
            </a>
        </aside>
    </main>

    <footer class="site-footer" id="about">
        <div class="footer-column footer-names">
            <p>Created by ₍ᐢ. .ᐢ₎</p>
            <p>Oti, Ao, Selina, Lyra</p>
        </div>

        <div class="footer-column footer-rights">
            <p>All rights reserved</p>
        </div>

        <div class="footer-column footer-logos">
            <img src="../images/logo_1.png" alt="Logo 1" class="footer-logo">
            <img src="../images/logo_2.png" alt="Logo 2" class="footer-logo">
            <img src="../images/logo_3.png" alt="Logo 3" class="footer-logo">
        </div>
    </footer>
</body>
</html>
